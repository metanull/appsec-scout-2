# Prebuilt-image override — opt-in alternative to building the images locally.
#
# Runs the stack from the images CI publishes to the GitHub Container Registry
# (.github/workflows/image-publish.yml: Trivy-gated, pushed on every merge to main)
# instead of building from the Dockerfiles. Activate it by adding this line to the
# root .env (or setting the same variable in the shell environment) so that every
# `docker compose` invocation — the PowerShell scripts included — picks it up
# automatically:
#
#     COMPOSE_FILE=docker-compose.yml;docker-compose.ghcr.yml
#
# The `;` path separator is the Docker Compose default on Windows. On Linux/macOS the
# default separator is `:` (or set COMPOSE_PATH_SEPARATOR explicitly). To combine with
# the PostgreSQL engine override, `docker-compose.pgsql.yml` must come BEFORE this file
# (COMPOSE_FILE=docker-compose.yml;docker-compose.pgsql.yml;docker-compose.ghcr.yml) —
# both files define the `postgres` service's `image`, and the last file listed wins, so
# listing pgsql last reverts `postgres` to the locally-built `appsec-scout-postgres:latest`
# and `docker compose pull` fails with "pull access denied".
#
# APPSEC_IMAGE_TAG selects the tag (default: latest). Deployments should pin the
# immutable sha-<short-commit> tag of a vetted build instead of tracking latest.
# Only tags built from commits that include the runtime-CA entrypoint (see
# docker/entrypoint.sh, /host-certs) support corporate-proxy CA trust; older tags
# still run, but ignore .docker/certs.
#
# What it changes, relative to docker-compose.yml:
#   - app, collector, static-analysis-collector, mysql, and trivy-server run the
#     published ghcr.io/metanull/appsec-scout-2/<name> images; their build:
#     sections are removed, so nothing is ever compiled or built locally
#     (trivy-token-init and dependencytrack-bootstrap, which reuse the app image,
#     are repointed too);
#   - postgres is repointed the same way, but only exists behind the local-db
#     profile (same profile as docker-compose.pgsql.yml's own postgres service),
#     since Compose merges profiles per service across files: without this,
#     Home GHCR mode (docker-compose.pgsql.yml absent) would define a postgres
#     service with no profile and start an unconfigured container that crashes
#     immediately (no POSTGRES_* environment set);
#   - the image content is authoritative: the ./app-laravel bind mount and the
#     *_vendor / *_bootstrap_cache named volumes are dropped, because a named
#     volume is seeded from image content only when first created and would
#     permanently shadow a newer pulled image's code with stale content;
#   - every service that runs the entrypoint sets APP_SKIP_COMPOSER_INSTALL=1, so
#     the runtime `composer install` (meant for the build-from-source bind mount)
#     never runs and never reaches a package registry — see docker/entrypoint.sh;
#   - data and state volumes are unchanged: app_storage (persisted .env/APP_KEY),
#     the app_public_* asset volumes (resynced from the image on every start by
#     the entrypoint), workspace scratch volumes, and trivy_token — so switching
#     between built and pulled images preserves all application state.
#
# The ops and claude profile images are workstation-side dev tools, never published;
# they keep building locally and are not part of this override.
#
# This file must be listed AFTER docker-compose.yml, never used alone.

services:
    app:
        image: ${APPSEC_IMAGE_REGISTRY:-ghcr.io/metanull/appsec-scout-2}/app:${APPSEC_IMAGE_TAG:-latest}
        build: !reset null
        environment:
            APP_SKIP_COMPOSER_INSTALL: "1"
        volumes: !override
            - app_storage:/var/www/html/storage
            - app_public_build:/var/www/html/public/build
            - app_public_css:/var/www/html/public/css
            - app_public_js:/var/www/html/public/js
            - ${SBOM_OUTPUT_DIR:-./output/sbom-scan}:/var/www/html/sbom-import:ro
            - ${STATIC_ANALYSIS_OUTPUT_DIR:-./output/static-analysis-scan}:/var/www/html/static-analysis-import:ro
            - ./.docker/certs:/host-certs:ro

    trivy-token-init:
        image: ${APPSEC_IMAGE_REGISTRY:-ghcr.io/metanull/appsec-scout-2}/app:${APPSEC_IMAGE_TAG:-latest}
        environment:
            APP_SKIP_COMPOSER_INSTALL: "1"

    dependencytrack-bootstrap:
        image: ${APPSEC_IMAGE_REGISTRY:-ghcr.io/metanull/appsec-scout-2}/app:${APPSEC_IMAGE_TAG:-latest}
        environment:
            APP_SKIP_COMPOSER_INSTALL: "1"
        volumes: !override
            - app_storage:/var/www/html/storage
            - app_public_build:/var/www/html/public/build
            - app_public_css:/var/www/html/public/css
            - app_public_js:/var/www/html/public/js
            - trivy_token:/var/lib/trivy-token:ro
            - ./.docker/certs:/host-certs:ro

    collector:
        image: ${APPSEC_IMAGE_REGISTRY:-ghcr.io/metanull/appsec-scout-2}/collector:${APPSEC_IMAGE_TAG:-latest}
        build: !reset null
        environment:
            APP_SKIP_COMPOSER_INSTALL: "1"
        volumes: !override
            - app_storage:/var/www/html/storage
            - collector_workspace:/workspace-scratch
            - trivy_token:/var/lib/trivy-token:ro
            - ./.docker/certs:/host-certs:ro

    static-analysis-collector:
        image: ${APPSEC_IMAGE_REGISTRY:-ghcr.io/metanull/appsec-scout-2}/static-analysis-collector:${APPSEC_IMAGE_TAG:-latest}
        build: !reset null
        environment:
            APP_SKIP_COMPOSER_INSTALL: "1"
        volumes: !override
            - app_storage:/var/www/html/storage
            - static_analysis_collector_workspace:/workspace-scratch
            - ./.docker/certs:/host-certs:ro

    mysql:
        image: ${APPSEC_IMAGE_REGISTRY:-ghcr.io/metanull/appsec-scout-2}/mysql:${APPSEC_IMAGE_TAG:-latest}
        build: !reset null

    trivy-server:
        image: ${APPSEC_IMAGE_REGISTRY:-ghcr.io/metanull/appsec-scout-2}/trivy-server:${APPSEC_IMAGE_TAG:-latest}
        build: !reset null

    postgres:
        image: ${APPSEC_IMAGE_REGISTRY:-ghcr.io/metanull/appsec-scout-2}/postgres:${APPSEC_IMAGE_TAG:-latest}
        build: !reset null
        # Same profile as docker-compose.pgsql.yml's own postgres service — without it,
        # Home GHCR mode would start an unconfigured postgres container.
        profiles:
            - local-db
