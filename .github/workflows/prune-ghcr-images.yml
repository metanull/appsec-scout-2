# Prunes old GHCR versions of the six container images this repo publishes (see
# image-publish.yml: app, collector, static-analysis-collector, mysql, postgres,
# trivy-server, all under ghcr.io/metanull/appsec-scout-2/<name>) so storage doesn't grow
# unbounded. This complements a one-time manual cleanup of a large backlog of old
# versions — this workflow keeps the backlog from building back up again.
#
# Runs weekly (Sunday 03:17 UTC, off the top of the hour to avoid the scheduled-workflow
# stampede at :00) plus workflow_dispatch for an on-demand run.
#
# A version carrying a release tag (X.Y.Z, X.Y, X or latest — published for a vX.Y.Z
# release, see .github/workflows/release.yml) is never deleted, since deployments pin
# those. Of the remaining versions (main and sha-<short> builds, untagged leftovers), the
# 3 newest are kept. The images are pushed single-platform with provenance disabled, so
# each image is exactly one package version: keeping a version keeps the whole image.
#
# actions/delete-package-versions can't express this: for container packages its
# ignore-versions regex is tested against the digest, not the tags. The two REST calls it
# made (list and delete versions of a user-owned package) are done here with gh instead.

name: Prune GHCR Image Versions

permissions:
  contents: read

on:
  schedule:
    - cron: "17 3 * * 0"

  workflow_dispatch:

jobs:
  prune:
    name: Prune ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        package:
          - app
          - collector
          - static-analysis-collector
          - mysql
          - postgres
          - trivy-server

    steps:
      - name: Delete old versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: appsec-scout-2/${{ matrix.package }}
        run: |
          set -euo pipefail
          base="/users/metanull/packages/container/${PACKAGE//\//%2F}"
          gh api --paginate "${base}/versions?per_page=100" \
            --jq '.[] | {id, created_at, tags: .metadata.container.tags}' \
            | jq -s -r '
                sort_by(.created_at) | reverse
                | map(select(any(.tags[]; test("^(latest|[0-9]+(\.[0-9]+){0,2})$")) | not))
                | .[3:][] | .id' \
            | while read -r id; do
                echo "Deleting ${PACKAGE} version ${id}"
                gh api -X DELETE "${base}/versions/${id}"
              done
