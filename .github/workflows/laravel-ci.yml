name: Mandatory Checks

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

  workflow_dispatch:

jobs:

  audit-composer:
    name: Audit - Composer (php)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.composer_changed == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: intl, pdo_mysql, pdo_pgsql, bcmath, zip, pcntl

      - name: "Validate composer.json"
        working-directory: app-laravel
        run: |
          composer validate --with-dependencies --strict

      - name: "Install Dependencies"
        working-directory: app-laravel
        run: |
          composer install --no-interaction --no-scripts --prefer-dist

      - name: "Audit Vulnerabilities"
        working-directory: app-laravel
        run: |
          composer audit --format=summary
  
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.detect.outputs.changed_files }}
      composer_changed: ${{ steps.detect.outputs.composer_changed }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes paths
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed_files=true" >> $GITHUB_OUTPUT
            echo "composer_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE" HEAD)

          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^app-laravel/(app|routes|config|database|tests|bootstrap)/|^app-laravel/(composer\.json|composer\.lock|phpunit(\.[a-z]+)?\.xml|artisan)$'; then
            echo "changed_files=true" >> $GITHUB_OUTPUT
          else
            echo "changed_files=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE '^app-laravel/composer\.(json|lock)$'; then
            echo "composer_changed=true" >> $GITHUB_OUTPUT
          else
            echo "composer_changed=false" >> $GITHUB_OUTPUT
          fi

  ci-checks:
    name: Validation
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_files == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appsec_scout_test
          POSTGRES_USER: appsec_scout
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appsec_scout -d appsec_scout_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: intl, pdo_mysql, pdo_pgsql, bcmath, zip, pcntl
          tools: pint, phpstan, pest
          coverage: none

      - name: Install dependencies
        working-directory: app-laravel
        run: |
          composer install --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Copy .env
        working-directory: app-laravel
        run: cp .env.example .env

      - name: Generate app key
        working-directory: app-laravel
        run: php artisan key:generate

      - name: Lint (Pint)
        working-directory: app-laravel
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        working-directory: app-laravel
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Test (Pest)
        working-directory: app-laravel
        run: vendor/bin/pest --no-coverage
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      # Second engine run: proves cross-engine portability on every PR. Connection
      # name and database are forced by phpunit.pgsql.xml; host/port/credentials
      # target the postgres service container above.
      - name: Test (Pest, PostgreSQL)
        working-directory: app-laravel
        run: vendor/bin/pest --no-coverage --configuration phpunit.pgsql.xml
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USERNAME: appsec_scout
          DB_PASSWORD: password

  ci-success:
    name: ci
    runs-on: ubuntu-latest
    needs: [audit-composer, detect-changes, ci-checks]
    if: always()

    steps:
      - name: "Check all mandatory checks passed"
        run: |
          changesDetected=${{ needs.detect-changes.outputs.changed_files }}
          composerChanged=${{ needs.detect-changes.outputs.composer_changed }}
          composerAuditResult=${{ needs.audit-composer.result }}
          ciChecksResult=${{ needs.ci-checks.result }}

          failed=false

          if [ "$composerChanged" = "true" ] && [ "$composerAuditResult" != "success" ]; then
            echo "composer.json/composer.lock changed and Composer audit did not pass."
            failed=true
          fi

          if [ "$changesDetected" = "true" ] && [ "$ciChecksResult" != "success" ]; then
            echo "Relevant application files changed and Validation did not pass."
            failed=true
          fi

          if [ "$failed" = "true" ]; then
            echo "One or more required checks failed."
            exit 1
          fi

          echo "All required checks passed."
